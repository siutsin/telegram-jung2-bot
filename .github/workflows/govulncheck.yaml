name: govulncheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '22 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Scan for reachable vulnerabilities
        uses: geomys/sandboxed-step@a6bfc174e532cea4f378e3427bcde8b714c2e810 # v1.2.2
        with:
          run: |
            set +e
            # Exit 3 is vulns found. Retry only tool failures (exit 1).
            for attempt in 1 2 3; do
              GOFLAGS=-mod=mod go run golang.org/x/vuln/cmd/govulncheck@latest ./...
              status=$?
              if [ "$status" -eq 0 ] || [ "$status" -eq 3 ]; then
                exit "$status"
              fi
              echo "govulncheck failed with $status (attempt $attempt)"
              sleep 15
            done
            exit 1
