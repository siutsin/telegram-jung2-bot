name: Latest Dependencies

on:
  pull_request:
    paths:
      - '.github/workflows/latest-dependencies.yaml'
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Test latest dependencies
        uses: geomys/sandboxed-step@a6bfc174e532cea4f378e3427bcde8b714c2e810 # v1.2.2
        with:
          run: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang lld
            ./hack/install-buck2.sh
            export PATH="$HOME/.cargo/bin:$PATH"
            # Keep unreviewed dependency updates out of production to limit supply chain risk.
            # See https://words.filippo.io/dependabot/
            go get -u -t ./...
            make vendor
            make test-only
