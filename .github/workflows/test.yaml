name: Test

on:
  push:
  pull_request:

jobs:
  # Architecture-independent, so run it once.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buck2
        run: |
          ./hack/install-buck2.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up lint tools
        run: |
          ./hack/install-lint-tools.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run lint
        run: make vendor && make lint

  # Deployed to both architectures. Buck2 builds the Go standard library from
  # source, which has failed on one architecture and not the other before.
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buck2
        run: |
          ./hack/install-buck2.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: make vendor && make test-only
